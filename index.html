            width: 10px;

            background: #E0F2FE;
        }
        ::-webkit-scrollbar-thumb {

        // --- WEB SPEECH API (AUDIO NARASI) ---
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop audio sebelumnya
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.rate = 0.85; // Bicara perlahan untuk ABK
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            } else {
                console.log("Web Speech API tidak didukung browser ini.");
            }
        }

        function speakCurrentPage() {
            const content = document.getElementById("app-content");
            if (content) {
                const readableText = content.innerText.replace(/[\r\n]+/g, ". ");
                speakText(readableText.substring(0, 300)); // Baca ringkas
            }
        }

        // --- RENDER MENU UTAMA ---

                            <h2 class="text-2xl md:text-4xl font-black mb-2">Selamat Belajar, Anak Hebat! 👋</h2>
                            <p class="text-sky-100 text-sm md:text-lg mb-4">Mari belajar 6 Rukun Iman dengan Gambar, Suara, dan Permainan Seru.</p>
                            <button onclick="speakText('Selamat Datang di media pembelajaran Ayo Mengenal 6 Rukun Iman. Sentuh salah satu kartu warna-warni di bawah untuk mulai belajar!')" class="bg-white text-sky-600 hover:bg-yellow-300 font-bold px-5 py-3 rounded-2xl shadow-md touch-btn flex items-center space-x-2 text-sm md:text-base">
                                <i class="fa-solid fa-volume-high text-xl"></i>
                                <span>Dengarkan Petunjuk</span>
                            </button>
                        </div>
                        <i class="fa-solid fa-shapes text-9xl absolute -right-10 -bottom-10 text-white/10"></i>
                    </div>

                            <i class="fa-solid fa-shapes text-sky-500"></i> Pilih Modul Belajar:
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            ${modules.map(m => `
                                <div onclick="openModule(${m.id})" class="bg-white rounded-3xl p-5 border-2 border-slate-100 card-shadow hover:border-sky-400 transition-all cursor-pointer touch-btn flex flex-col justify-between relative overflow-hidden group">
                                    <div class="${m.color} text-white w-14 h-14 rounded-2xl flex items-center justify-center text-2xl font-black mb-4 shadow-md group-hover:scale-110 transition-transform">
                                        <i class="fa-solid ${m.icon}"></i>
                                    </div>
                                    <div>
                                        <span class="text-xs font-bold ${m.textColor} uppercase tracking-wider">${m.title}</span>
                                        <h4 class="text-lg font-black text-slate-800 leading-snug mb-1">${m.subtitle}</h4>
                                    </div>
                                    <div class="mt-4 flex items-center justify-between pt-3 border-t border-slate-100">
                                        <span class="text-xs font-semibold text-slate-400">
                                            ${state.completedModules.includes(m.id) ? '<span class="text-emerald-500 font-bold"><i class="fa-solid fa-circle-check"></i> Selesai</span>' : 'Klik untuk Buka'}

        // --- BUKA MODUL SPESIFIK ---
        function openModule(moduleId) {
            const m = modules.find(x => x.id === moduleId);
            if (!m) return;

            state.currentModule = m;
            state.currentStep = 1; // Step 1: Materi, Step 2: Kuis Interaktif
            renderModuleStep();
        }

                            </button>
                            <span class="font-extrabold ${m.textColor} text-sm md:text-base">${m.title}: ${m.subtitle}</span>
                            <button onclick="speakText('${m.introText}')" class="bg-yellow-400 hover:bg-yellow-500 text-sky-950 font-bold px-3 py-2 rounded-xl touch-btn flex items-center space-x-1">

                            </button>
                        </div>

                        <!-- Kartu Penjelasan Utama -->
                        <div class="${m.lightColor} border-2 rounded-3xl p-6 md:p-8 text-center space-y-4 shadow-sm">
                            <div class="${m.color} text-white w-20 h-20 rounded-3xl mx-auto flex items-center justify-center text-4xl shadow-lg bounce-gentle">
                                <i class="fa-solid ${m.icon}"></i>
                            </div>
                            <h2 class="text-2xl md:text-3xl font-black ${m.textColor}">${m.subtitle}</h2>
                            <p class="text-slate-700 text-lg md:text-xl font-medium max-w-2xl mx-auto leading-relaxed">
                                "${m.introText}"
                            </p>
                        </div>

                        <!-- KONTEN SPESIFIK TIAP MODUL (KARTU VISUAL) -->
                        ${renderModuleSpecificContent(m)}

                        <!-- Tombol Lanjut ke Kuis -->
                        <div class="pt-4 flex justify-end">
                            <button onclick="nextStep()" class="w-full md:w-auto bg-emerald-500 hover:bg-emerald-600 text-white font-black px-8 py-4 rounded-2xl text-xl shadow-lg touch-btn flex items-center justify-center space-x-3">
                                <span>Lanjut Permainan Kuis</span>
                                <i class="fa-solid fa-circle-arrow-right text-2xl"></i>
                            </button>
                        </div>
                    </div>
                `;
            } else if (state.currentStep === 2) {
                // TAMPILAN KUIS BERGAMBAR INTERAKTIF
                speakText(m.quiz.speech);

                app.innerHTML = `
                    <div class="space-y-6">
                        <!-- Navigation Bar Sub-Modul -->
                        <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                            <button onclick="state.currentStep = 1; renderModuleStep();" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-xl touch-btn">
                                <i class="fa-solid fa-arrow-left"></i> Baca Materi Lagi
                            </button>
                            <span class="font-extrabold text-emerald-600 text-sm md:text-base"><i class="fa-solid fa-gamepad"></i> Permainan Kuis</span>
                        </div>

                        <!-- Pertanyaan Kuis -->
                        <div class="bg-white border-2 border-sky-300 rounded-3xl p-6 md:p-8 text-center space-y-4 shadow-md">
                            <span class="bg-sky-100 text-sky-800 font-bold px-4 py-1.5 rounded-full text-xs md:text-sm inline-block">PERTANYAAN GAMBAR</span>
                            <h3 class="text-xl md:text-2xl font-black text-slate-800 leading-snug">
                                ${m.quiz.question}
                            </h3>
                            <button onclick="speakText('${m.quiz.speech}')" class="bg-yellow-400 hover:bg-yellow-500 text-sky-950 font-bold px-4 py-2 rounded-xl touch-btn inline-flex items-center space-x-2 text-sm">
                                <i class="fa-solid fa-volume-high"></i>
                                <span>Dengarkan Soal Lagi</span>
                            </button>
                        </div>

                        <!-- Pilihan Jawaban Bergambar (Besar & Mudah Ditekan) -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${m.quiz.options.map((opt, idx) => `
                                <button onclick="checkAnswer(${opt.isCorrect}, '${opt.text}')" class="bg-white border-4 border-slate-200 hover:border-sky-400 rounded-3xl p-6 text-center shadow-md touch-btn flex flex-col items-center justify-center space-y-3 group transition-all">
                                    <div class="w-20 h-20 rounded-2xl ${opt.color || 'bg-sky-100 text-sky-600'} flex items-center justify-center text-4xl shadow-inner group-hover:scale-110 transition-transform">
                                        <i class="fa-solid ${opt.icon}"></i>
                                    </div>
                                    <span class="text-xl font-black text-slate-800">${opt.text}</span>
                                    <span class="text-xs text-slate-400 font-bold">Tekan untuk Memilih</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }

        // Render Konten Spesifik berdasarkan Modul ID
        function renderModuleSpecificContent(m) {
            if (m.cards) { // Modul 1
                return `
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${m.cards.map(c => `
                            <div onclick="speakText('Rukun Iman ke ${c.num}: ${c.name}. ${c.desc}')" class="bg-white p-5 rounded-2xl border-2 border-slate-200 shadow-sm hover:border-amber-400 transition-all cursor-pointer touch-btn flex items-center space-x-4">
                                <div class="bg-amber-100 text-amber-700 font-black w-12 h-12 rounded-xl flex items-center justify-center text-xl shrink-0">
                                    ${c.num}
                                </div>
                                <div>
                                    <h4 class="font-bold text-slate-800 text-base">${c.name}</h4>
                                    <p class="text-xs text-slate-500">${c.desc}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (m.asmaulHusna) { // Modul 2
                return `
                    <div class="space-y-3">
                        <h4 class="font-extrabold text-slate-700 text-lg">Mengenal Nama Indah Allah (Asmaul Husna):</h4>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            ${m.asmaulHusna.map(a => `
                                <div onclick="speakText('${a.name} artinya ${a.mean}')" class="bg-white p-4 rounded-2xl border border-emerald-200 text-center shadow-sm cursor-pointer touch-btn">
                                    <div class="text-emerald-600 font-black text-lg">${a.name}</div>
                                    <div class="text-xs text-slate-500 font-medium">${a.mean}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (m.malaikatList) { // Modul 3
                return `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        ${m.malaikatList.map(malk => `
                            <div onclick="speakText('Malaikat ${malk.name} tugasnya ${malk.duty}')" class="bg-white p-4 rounded-2xl border border-sky-200 shadow-sm cursor-pointer touch-btn flex items-center space-x-3">
                                <div class="bg-sky-100 text-sky-600 p-3 rounded-xl"><i class="fa-solid fa-feather"></i></div>
                                <div>
                                    <div class="font-bold text-slate-800 text-sm">Malaikat ${malk.name}</div>
                                    <div class="text-xs text-sky-600 font-medium">${malk.duty}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (m.kitabList) { // Modul 4
                return `
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        ${m.kitabList.map(k => `
                            <div onclick="speakText('Kitab ${k.kitab} diturunkan kepada ${k.nabi}')" class="bg-white p-4 rounded-2xl border border-indigo-200 text-center shadow-sm cursor-pointer touch-btn">
                                <i class="fa-solid fa-book-bookmark text-indigo-500 text-3xl mb-2"></i>
                                <div class="font-black text-slate-800 text-base">${k.kitab}</div>
                                <div class="text-xs text-indigo-600 font-medium">${k.nabi}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (m.sifatRasul) { // Modul 5
                return `
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        ${m.sifatRasul.map(s => `
                            <div onclick="speakText('${s.title} artinya ${s.meaning}')" class="bg-white p-4 rounded-2xl border border-teal-200 text-center shadow-sm cursor-pointer touch-btn">
                                <div class="font-black text-teal-700 text-lg">${s.title}</div>
                                <div class="text-xs text-slate-500 font-medium">${s.meaning}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            return '';
        }

        // --- CEK JAWABAN KUIS ---
        function checkAnswer(isCorrect, answerText) {
            state.totalQuestions++;
            state.studentResponses.push({
                module: state.currentModule.title,
                answer: answerText,
                isCorrect: isCorrect
            });

            const modal = document.getElementById("feedback-modal");
            const modalIcon = document.getElementById("modal-icon");
            const modalTitle = document.getElementById("modal-title");
            const modalDesc = document.getElementById("modal-desc");

            if (isCorrect) {
                state.correctAnswers++;
                state.score += 12.5; // Total 8 Modul = 100
                if (!state.completedModules.includes(state.currentModule.id)) {
                    state.completedModules.push(state.currentModule.id);
                }

                modalIcon.innerText = "🌟";
                modalTitle.innerText = "Hebat Sekali!";
                modalTitle.className = "text-2xl font-black text-emerald-600 mb-2";
                modalDesc.innerText = "Kamu memilih jawaban yang benar!";
                speakText("Hebat sekali! Jawaban kamu benar!");
            } else {
                state.needsHelpCount++;
                modalIcon.innerText = "🤗";
                modalTitle.innerText = "Ayo Coba Lagi!";
                modalTitle.className = "text-2xl font-black text-amber-600 mb-2";
                modalDesc.innerText = "Tidak apa-apa, ayo dengarkan dan coba lagi bersama guru.";
                speakText("Tidak apa-apa, mari coba sekali lagi bersama-sama.");
            }

            modal.classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("feedback-modal").classList.add("hidden");
            goToHome();
        }

        function nextStep() {
            state.currentStep = 2;
            renderModuleStep();
        }

        // --- MODE GURU / ORANG TUA ---
        function openTeacherMode() {
            window.speechSynthesis.cancel();
            const app = document.getElementById("app-content");
            document.getElementById("progress-bar-container").classList.add("hidden");

            app.innerHTML = `
                <div class="space-y-6">
                    <!-- Header Mode Guru -->
                    <div class="flex justify-between items-center bg-teal-700 text-white p-5 rounded-3xl shadow-md">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-user-gear text-3xl text-yellow-300"></i>
                            <div>
                                <h2 class="text-xl font-extrabold">MODE GURU & ORANG TUA</h2>
                                <p class="text-xs text-teal-100">Panduan Asesmen & Perkembangan Belajar Siswa</p>
                            </div>
                        </div>
                        <button onclick="goToHome()" class="bg-teal-800 hover:bg-teal-900 text-white font-bold px-4 py-2 rounded-xl touch-btn text-sm">
                            <i class="fa-solid fa-xmark"></i> Tutup
                        </button>
                    </div>

                    <!-- Rekapitulasi Perkembangan Siswa -->
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                        <h3 class="text-lg font-black text-slate-800 border-b pb-2">
                            <i class="fa-solid fa-chart-line text-teal-600"></i> Rekapitulasi Perkembangan Siswa
                        </h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                            <div class="bg-sky-50 p-4 rounded-2xl border border-sky-200">
                                <div class="text-2xl font-black text-sky-600">${state.completedModules.length} / 8</div>
                                <div class="text-xs text-slate-500 font-bold">Modul Selesai</div>
                            </div>
                            <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200">
                                <div class="text-2xl font-black text-emerald-600">${state.correctAnswers}</div>
                                <div class="text-xs text-slate-500 font-bold">Jawaban Benar</div>
                            </div>
                            <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200">
                                <div class="text-2xl font-black text-amber-600">${state.needsHelpCount}</div>
                                <div class="text-xs text-slate-500 font-bold">Perlu Bimbingan</div>
                            </div>
                            <div class="bg-purple-50 p-4 rounded-2xl border border-purple-200">
                                <div class="text-2xl font-black text-purple-600">${Math.round(state.score)}</div>
                                <div class="text-xs text-slate-500 font-bold">Estimasi Skor</div>
                            </div>
                        </div>
                    </div>

                    <!-- Panduan Pendampingan Guru -->
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                        <h3 class="text-lg font-black text-slate-800 border-b pb-2">
                            <i class="fa-solid fa-chalkboard-user text-teal-600"></i> Panduan Pendampingan Siswa SLB
                        </h3>
                        <ul class="list-disc list-inside space-y-2 text-sm text-slate-600 leading-relaxed">
                            <li>Gunakan tombol audio ikon speaker untuk membacakan narasi jika siswa kesulitan membaca secara tertulis.</li>
                            <li>Siswa yang kesulitan komunikasi lisan dapat menjawab kuis dengan menunjuk layar sentuh secara langsung.</li>
                            <li>Berikan penguatan positif dan waktu tunggu secukupnya saat siswa memproses informasi visual.</li>
                        </ul>
                    </div>

                    <!-- Dokumen Pendukung & Integrasi Google Docs -->
                    <div class="bg-amber-50 border border-amber-300 p-6 rounded-3xl space-y-3">
                        <h3 class="text-lg font-black text-amber-900 flex items-center gap-2">
                            <i class="fa-solid fa-file-word text-blue-600"></i> Dokumen Pendukung & RPP
                        </h3>
                        <p class="text-xs text-amber-800">
                            Dokumen identitas mata pelajaran, RPP, rubrik penilaian, dan lembar observasi siswa SLB Fase D tersedia untuk diunduh atau diunggah ke Google Docs.
                        </p>
                        <div class="flex flex-wrap gap-3 pt-2">
                            <button onclick="downloadWordGuide()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2.5 rounded-xl text-sm shadow-md touch-btn flex items-center space-x-2">
                                <i class="fa-solid fa-download"></i>
                                <span>Unduh Panduan (.docx)</span>
                            </button>
                            <a href="https://docs.google.com" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2.5 rounded-xl text-sm shadow-md touch-btn flex items-center space-x-2">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                <span>Buka Google Docs</span>
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- SIMULASI DOWNLOAD DOKUMEN PANDUAN GURU ---
        function downloadWordGuide() {
            const docContent = `
===================================================================
DOKUMEN PENDUKUNG MEDIA PEMBELAJARAN INTERAKTIF PAI SLB FASE D
Judul: AYO MENGENAL 6 RUKUN IMAN
===================================================================

A. IDENTITAS MATA PELAJARAN
   - Mata Pelajaran  : Pendidikan Agama Islam dan Budi Pekerti
   - Sasaran         : Siswa SLB / Anak Berkebutuhan Khusus (Fase D)
   - Metode          : Audio-Visual-Kinestetik Interaktif

B. KARAKTERISTIK SISWA & TUJUAN
   - Membantu siswa yang belum membaca lancar mengenal Rukun Iman.
   - Pilihan berbasis gambar dan narasi suara otomatis.

C. RUBRIK PENILAIAN OBSERVASI
   1. Mengenal Gambar Ciptaan Allah & Simbol Rukun Iman.
   2. Merespons Instruksi Audio.
   3. Menerapkan Perilaku Terpuji Sehari-hari.
            `;

            const blob = new Blob([docContent], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'Panduan_Guru_PAI_SLB_Fase_D.txt';
            link.click();
        }

        // --- INISIALISASI APLIKASI SAAT REFRESH ---
        window.onload = function() {
            goToHome();
        };
    </script>
</body>
</html>
